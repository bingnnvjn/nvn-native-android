name: ci

# 单一入口。四条腿 + 一个汇总门：
#   guard           — 仓库红线（全历史）+ DERIVED 账本 + README 免责段，不编任何东西
#   pc-x86_64       — lavapipe 上跑全部断言，validation clean
#   arm64-linux     — AArch64 原生，x18 保留，TLS/gate/stack 契约
#   android-aarch64 — NDK 交叉 + aapt2/d8/apksigner 出 APK，再跑 APK 门禁
#   shell-apk       — 产品壳占位（d2r 血统），v0 不启用
#
# 设计依据：docs/PIPELINE.md（#21）。所有 action 用 commit SHA，不用 tag。

on:
  push:
    branches:
      - main
      - spike/abi-slice
      - arch/l0-l6
      - ci/pipeline
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------------
  # 红线门禁：最快、最便宜、PR 上第一个红。扫的是全历史，不是工作树。
  # ------------------------------------------------------------------------
  guard:
    name: guard (repo red lines)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tree and history
        run: bash ci/guard/scan_tree.sh

      - name: Check DERIVED ledger
        run: python3 ci/guard/check_derived_ledger.py

      - name: Check docs (README disclaimer, release-notes template)
        run: bash ci/guard/check_docs.sh

  # ------------------------------------------------------------------------
  # PC 回归：Mesa lavapipe，Vulkan 1.4，validation layer 必须真的加载。
  # ------------------------------------------------------------------------
  pc-x86_64:
    name: pc-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Mesa / Vulkan / glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools vulkan-validationlayers \
            glslang-tools libvulkan-dev build-essential shellcheck

      - name: Install Rust stable
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
          rustc --version

      - name: Build nvn_host (release)
        working-directory: spike/abi-slice
        run: cargo build --release

      - name: Configure lavapipe ICD
        working-directory: spike/abi-slice
        run: |
          set -euo pipefail
          mkdir -p dist/pc
          icd=""
          for f in /usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
                   /usr/share/vulkan/icd.d/lvp_icd.json; do
            if [ -f "$f" ]; then icd="$f"; break; fi
          done
          if [ -z "$icd" ]; then
            for f in /usr/share/vulkan/icd.d/lvp_icd.*.json; do
              if [ -f "$f" ]; then icd="$f"; break; fi
            done
          fi
          if [ -n "$icd" ]; then
            echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
            echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          else
            echo "::warning::lavapipe ICD JSON not found; falling back to loader default"
          fi

      - name: Compile C guest
        working-directory: spike/abi-slice
        run: |
          set -euo pipefail
          mkdir -p dist/pc
          cp target/release/libnvn_host.so dist/pc/
          cc -std=c11 -O2 -fno-stack-protector -Iinclude guest/guest.c \
            -o dist/pc/abi_guest \
            -Ltarget/release -lnvn_host \
            -Wl,-rpath,'$ORIGIN' -ldl -lpthread -lm
          readelf -h dist/pc/abi_guest | sed -n '1,20p'

      - name: Static checks (C layout, slot table, JSON, shell)
        working-directory: spike/abi-slice
        run: bash scripts/check.sh

      - name: Verify lavapipe
        working-directory: spike/abi-slice
        run: |
          set -euo pipefail
          mkdir -p dist/pc
          vulkaninfo --summary > dist/pc/vulkaninfo.txt 2>&1
          cat dist/pc/vulkaninfo.txt
          grep -qi 'deviceName' dist/pc/vulkaninfo.txt

      - name: JNI smoke (Linux)
        working-directory: spike/abi-slice
        run: bash scripts/jni_smoke.sh

      - name: Guest — all
        working-directory: spike/abi-slice
        run: |
          set -euo pipefail
          ./dist/pc/abi_guest all 2>&1 | tee pc-all.log
          grep -q '"ok":true' pc-all.log

      - name: Guest — unimplemented (expect SIGABRT / 134)
        working-directory: spike/abi-slice
        run: |
          set +e
          ./dist/pc/abi_guest unimplemented > pc-unimplemented.log 2>&1
          rc=$?
          set -e
          cat pc-unimplemented.log
          test "$rc" -eq 134

      - name: Collect ELF metadata
        if: always()
        working-directory: spike/abi-slice
        run: |
          set +e
          mkdir -p dist/pc
          readelf -h dist/pc/abi_guest > dist/pc/readelf-h.txt 2>&1
          readelf -d dist/pc/abi_guest > dist/pc/readelf-d.txt 2>&1
          readelf -d dist/pc/libnvn_host.so > dist/pc/readelf-d-libnvn_host.txt 2>&1
          ldd dist/pc/abi_guest > dist/pc/ldd.txt 2>&1
          ls -l dist/pc > dist/pc/ls.txt 2>&1
          set -e

      - name: Upload PC artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abi-slice-pc
          path: |
            spike/abi-slice/pc-all.log
            spike/abi-slice/pc-unimplemented.log
            spike/abi-slice/dist/pc/
            spike/abi-slice/dist/jni/
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------------
  # AArch64 契约：不依赖设备，但用原生设置把 AAPCS64/LSE/TLS/thunk 跑一遍。
  # 这是正常 job，不是 continue-on-error —— runner 标签不可用就该红。
  # ------------------------------------------------------------------------
  arm64-linux:
    name: arm64-linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Mesa / Vulkan / glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools vulkan-validationlayers \
            glslang-tools libvulkan-dev build-essential shellcheck

      - name: Install Rust stable
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build nvn_host (+reserve-x18)
        working-directory: spike/abi-slice
        env:
          RUSTFLAGS: "-C target-feature=+reserve-x18"
        run: cargo build --release

      - name: Configure lavapipe ICD
        working-directory: spike/abi-slice
        run: |
          set -euo pipefail
          mkdir -p dist/arm64
          icd=""
          for f in /usr/share/vulkan/icd.d/lvp_icd.aarch64.json \
                   /usr/share/vulkan/icd.d/lvp_icd.json; do
            if [ -f "$f" ]; then icd="$f"; break; fi
          done
          if [ -z "$icd" ]; then
            for f in /usr/share/vulkan/icd.d/lvp_icd.*.json; do
              if [ -f "$f" ]; then icd="$f"; break; fi
            done
          fi
          if [ -n "$icd" ]; then
            echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
            echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          else
            echo "::warning::lavapipe ICD JSON not found; falling back to loader default"
          fi

      - name: Compile C guest
        working-directory: spike/abi-slice
        run: |
          set -euo pipefail
          mkdir -p dist/arm64
          cp target/release/libnvn_host.so dist/arm64/
          cc -std=c11 -O2 -fno-stack-protector -ffixed-x18 -DNVN_X18_RESERVED=1 -Iinclude guest/guest.c \
            -o dist/arm64/abi_guest \
            -Ltarget/release -lnvn_host \
            -Wl,-rpath,'$ORIGIN' -ldl -lpthread -lm
          readelf -h dist/arm64/abi_guest | sed -n '1,20p'

      - name: Verify lavapipe
        working-directory: spike/abi-slice
        run: |
          set -euo pipefail
          mkdir -p dist/arm64
          vulkaninfo --summary > dist/arm64/vulkaninfo.txt 2>&1
          grep -qi 'deviceName' dist/arm64/vulkaninfo.txt

      - name: Guest — all / gate / stackgate
        working-directory: spike/abi-slice
        run: |
          set -euo pipefail
          for mode in all gate stackgate; do
            ./dist/arm64/abi_guest "$mode" 2>&1 | tee "arm64-$mode.log"
            grep -q '"ok":true' "arm64-$mode.log"
          done

      - name: Guest — unimplemented (expect SIGABRT / 134)
        working-directory: spike/abi-slice
        run: |
          set +e
          ./dist/arm64/abi_guest unimplemented > arm64-unimplemented.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 134

      - name: Collect arm64 evidence
        if: always()
        working-directory: spike/abi-slice
        run: |
          set +e
          mkdir -p dist/arm64
          uname -a > dist/arm64/uname.txt 2>&1
          cc --version > dist/arm64/cc-version.txt 2>&1
          readelf -h dist/arm64/libnvn_host.so > dist/arm64/readelf-h-libnvn_host.txt 2>&1
          objdump -d dist/arm64/libnvn_host.so > dist/arm64/objdump.txt 2>&1
          grep -A4 -E '<nvn_(thunk|gate)_' dist/arm64/objdump.txt \
            > dist/arm64/objdump-thunks-raw.txt 2>&1
          head -200 dist/arm64/objdump-thunks-raw.txt > dist/arm64/objdump-thunks.txt 2>&1
          grep -n 'stadd' dist/arm64/objdump.txt > dist/arm64/stadd.txt 2>&1
          set -e

      - name: Upload arm64 artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abi-slice-arm64
          path: |
            spike/abi-slice/arm64-*.log
            spike/abi-slice/dist/arm64/
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------------
  # Android：交叉编译 + APK。APK 出来后立刻过三道门（内容 / manifest+签名 /
  # artifact 白名单），任何一道红都不上传。
  # ------------------------------------------------------------------------
  android-aarch64:
    name: android-aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools

      - name: Install Rust stable + Android target
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Set up Android NDK (r27d)
        id: ndk
        uses: nttld/setup-ndk@aacaf74664d0f8e1b070a865acb47ee25007386d # v1.6.0
        with:
          ndk-version: r27d

      - name: Configure Android cross toolchain
        env:
          NDK_PATH_FROM_ACTION: ${{ steps.ndk.outputs['ndk-path'] }}
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-${NDK_PATH_FROM_ACTION:-}}"
          test -d "$NDK" || { echo "::error::NDK not found"; exit 1; }
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          CC_BIN="$TOOLCHAIN/bin/aarch64-linux-android26-clang"
          AR_BIN="$TOOLCHAIN/bin/llvm-ar"
          test -x "$CC_BIN" || { echo "::error::missing $CC_BIN"; exit 1; }
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC_BIN"
            echo "CC_aarch64_linux_android=$CC_BIN"
            echo "AR_aarch64_linux_android=$AR_BIN"
            echo "ABI_SLICE_NDK_BIN=$TOOLCHAIN/bin"
          } >> "$GITHUB_ENV"

      - name: Build nvn_host for aarch64-linux-android
        working-directory: spike/abi-slice
        env:
          RUSTFLAGS: "-C target-feature=+reserve-x18"
        run: cargo build --release --target aarch64-linux-android

      - name: Package Android artifact
        working-directory: spike/abi-slice
        run: |
          set -euo pipefail
          NDK_BIN="${ABI_SLICE_NDK_BIN:?not set}"
          CC_BIN="${CC_aarch64_linux_android:?not set}"
          READELF="$NDK_BIN/llvm-readelf"
          OBJDUMP="$NDK_BIN/llvm-objdump"
          mkdir -p dist/android
          cp target/aarch64-linux-android/release/libnvn_host.so dist/android/
          "$CC_BIN" -std=c11 -O2 -fno-stack-protector -ffixed-x18 -DNVN_X18_RESERVED=1 -Iinclude guest/guest.c \
            -o dist/android/abi_guest \
            -Ltarget/aarch64-linux-android/release -lnvn_host \
            -Wl,-rpath,'$ORIGIN' -llog -ldl -lm -fPIE -pie
          cp scripts/run_android.sh dist/android/
          chmod +x dist/android/run_android.sh
          {
            echo "== abi_guest: ELF header =="
            "$READELF" -h dist/android/abi_guest
            echo "== libnvn_host.so: ELF header =="
            "$READELF" -h dist/android/libnvn_host.so
            echo "== dynamic sections =="
            "$READELF" -d dist/android/abi_guest
            "$READELF" -d dist/android/libnvn_host.so
            echo "== resolved symbols =="
            "$READELF" --dyn-syms --wide dist/android/libnvn_host.so \
              | grep -E 'nvnBootstrapLoader|nva_nvn_resolve' || true
          } > dist/android/readelf.txt 2>&1
          "$OBJDUMP" -d dist/android/libnvn_host.so > dist/android/objdump-libnvn_host.txt
          ( cd dist/android && sha256sum abi_guest libnvn_host.so run_android.sh > sha256sum.txt )
          # Build the tarball outside the directory being archived, then move it
          # in: writing it in place makes tar report "file changed as we read it".
          # It lands inside the guarded dir so check_artifact.sh sees its members.
          TMPTAR=$(mktemp -d)/abi-slice-android.tar.gz
          tar czf "$TMPTAR" -C dist/android .
          mv "$TMPTAR" dist/android/abi-slice-android.tar.gz
          ls -l dist/android/abi-slice-android.tar.gz

      - name: Build APK shell (aapt2/d8/apksigner, no Gradle)
        working-directory: spike/abi-slice
        env:
          TARGET_DIR: target/aarch64-linux-android/release
        run: bash android/build_apk.sh

      - name: Guard — APK has no game content
        run: bash ci/guard/scan_apk.sh spike/abi-slice/dist/android-apk/abi-slice.apk

      - name: Guard — manifest + signing certificate
        env:
          GUARD_MODE: artifact
        run: bash ci/guard/check_manifest.sh spike/abi-slice/dist/android-apk/abi-slice.apk

      - name: Guard — artifact whitelist
        run: |
          rm -rf spike/abi-slice/dist/android-apk/build
          bash ci/guard/check_artifact.sh spike/abi-slice/dist/android-apk abi-slice-apk

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abi-slice-apk
          # Explicit members: build_apk.sh also leaves lib/arm64-v8a/ in OUT,
          # and that duplicate .so must not ride along.
          path: |
            spike/abi-slice/dist/android-apk/abi-slice.apk
            spike/abi-slice/dist/android-apk/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Guard — evidence artifact contract
        if: always()
        run: bash ci/guard/check_artifact.sh spike/abi-slice/dist/android abi-slice-evidence evidence

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abi-slice-evidence
          path: spike/abi-slice/dist/android/
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------------
  # 产品壳占位：d2r 血统，需要 ci/dmgendir 替身（#15）。替身未入库前不启用。
  # ------------------------------------------------------------------------
  shell-apk:
    name: shell-apk (reserved)
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Pin SDK / NDK / CMake (same exact packages as dm/android/docker/Dockerfile)
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmake;3.31.6"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865"
          } >> "$GITHUB_ENV"

      - name: Build game-free shell APK
        run: |
          set -euo pipefail
          # Do NOT pass DM_ANDROID_CHECKS=ON: android/CMakeLists.txt then returns
          # at lines 15-19 and never links libdm.so (issue #15 finding). It is a
          # CMake option, not a Gradle flag, so there is nothing to turn off here.
          gradle --no-daemon -p dm/android :app:assembleDebug :app:lintDebug \
            -PdmGenDir=ci/dmgendir -PdmPython=$(command -v python3)

      - name: Guard — APK has no game content
        run: bash ci/guard/scan_apk.sh dm/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guard — product manifest + release certificate
        env:
          GUARD_MODE: product
          GUARD_PACKAGE: com.bingnnvjn.nva
          GUARD_TARGET_SDK: '36'
        run: bash ci/guard/check_manifest.sh dm/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guard — L6 packaging assertions
        run: |
          set -euo pipefail
          APK=dm/android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          # 16 KiB page alignment and JNI_OnLoad are ARCH §3.7 CI assertions.
          # Kept next to the build so they cannot drift into the device job.

      - name: Upload shell APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shell-apk
          path: dm/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ------------------------------------------------------------------------
  # 工具占位：nva-pack / nva-rewrite 的合成 fixture 测试。产品树未入库前不启用。
  # ------------------------------------------------------------------------
  tools:
    name: tools (reserved)
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Synthetic fixtures only — no --xci, no --keys
        run: |
          set -euo pipefail
          cargo test -p nva-pack -p nva-rewrite
          nva-verify rewrite --fixture ci/fixtures/rewrite-min
          nva-verify loadplan --fixture ci/fixtures/pack-min
          nva-pack verify ci/fixtures/pack-min

  # ------------------------------------------------------------------------
  # 汇总门：分支保护只需要这一个必需检查。
  # 启用 shell-apk / tools 时，必须把它们的 job id 加进 needs，否则启用后仍绿。
  # ------------------------------------------------------------------------
  gate:
    name: gate
    if: always()
    needs: [guard, pc-x86_64, arm64-linux, android-aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every leg green
        env:
          R_GUARD: ${{ needs.guard.result }}
          R_PC: ${{ needs['pc-x86_64'].result }}
          R_ARM: ${{ needs['arm64-linux'].result }}
          R_AND: ${{ needs['android-aarch64'].result }}
        run: |
          set -euo pipefail
          echo "guard=$R_GUARD pc=$R_PC arm64=$R_ARM android=$R_AND"
          for r in "$R_GUARD" "$R_PC" "$R_ARM" "$R_AND"; do
            if [ "$r" != "success" ]; then
              echo "::error::a CI leg did not succeed ($r)"
              exit 1
            fi
          done
